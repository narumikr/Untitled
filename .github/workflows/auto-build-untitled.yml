# .github/workflows/auto-build-untitled.yml
name: Untitled auto build and commit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "rollup.config.js"
      - "tsconfig.build.json"
      - "package*.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: auto-build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci

      - name: Check for dist changes
        id: diff
        run: |
          git add dist/ src/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push dist
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto build untitled"
          git push origin HEAD:${{ github.head_ref }}
